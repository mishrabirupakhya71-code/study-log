name: Weekly Study Summary
on:
  schedule:
    - cron: '0 0 * * 0'  # Every Sunday midnight UTC
  workflow_dispatch: {}

permissions:
  issues: write
  contents: read

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const since = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000);
            const sinceStr = since.toISOString();

            // Fetch study-session issues from the past week
            const { data: sessions } = await github.rest.issues.listForRepo({
              ...context.repo,
              state: 'all',
              labels: 'study-session',
              since: sinceStr,
              per_page: 100,
            });

            const studySessions = sessions.filter(i => !i.pull_request);

            // Fetch assignment issues
            const { data: assignments } = await github.rest.issues.listForRepo({
              ...context.repo,
              state: 'all',
              labels: 'assignment',
              since: sinceStr,
              per_page: 100,
            });

            const hw = assignments.filter(i => !i.pull_request);
            const completed = hw.filter(i => i.state === 'closed');

            // Parse subject info from issue titles
            const subjectStats = {};
            for (const issue of studySessions) {
              const match = issue.title.match(/📖 (.+?) — (.+?) \(/);
              if (match) {
                const subject = match[1];
                const durStr = match[2];
                // Parse duration like "2h 15m" or "45m"
                let minutes = 0;
                const hMatch = durStr.match(/(\d+)h/);
                const mMatch = durStr.match(/(\d+)m/);
                if (hMatch) minutes += parseInt(hMatch[1]) * 60;
                if (mMatch) minutes += parseInt(mMatch[1]);

                if (!subjectStats[subject]) {
                  subjectStats[subject] = { sessions: 0, minutes: 0 };
                }
                subjectStats[subject].sessions++;
                subjectStats[subject].minutes += minutes;
              }
            }

            const totalMinutes = Object.values(subjectStats).reduce((s, v) => s + v.minutes, 0);
            const totalHours = Math.floor(totalMinutes / 60);
            const totalMins = totalMinutes % 60;

            // Build subject breakdown table
            let subjectTable = '';
            if (Object.keys(subjectStats).length > 0) {
              subjectTable = `### 📚 Subject Breakdown\n| Subject | Time | Sessions |\n|---------|------|----------|\n`;
              const sorted = Object.entries(subjectStats).sort((a, b) => b[1].minutes - a[1].minutes);
              for (const [name, data] of sorted) {
                const h = Math.floor(data.minutes / 60);
                const m = data.minutes % 60;
                const durStr = h > 0 ? `${h}h ${m}m` : `${m}m`;
                subjectTable += `| ${name} | ${durStr} | ${data.sessions} |\n`;
              }

              // Mermaid pie chart
              subjectTable += `\n### 📊 Visual Breakdown\n\`\`\`mermaid\npie title Study Time Distribution\n`;
              for (const [name, data] of sorted) {
                subjectTable += `    "${name}" : ${data.minutes}\n`;
              }
              subjectTable += `\`\`\`\n`;
            }

            const weekStart = since.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
            const weekEnd = new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

            const body = [
              `## 📊 Weekly Study Summary`,
              `**${weekStart} — ${weekEnd}**`,
              ``,
              `### 🏆 Overview`,
              `| Metric | Value |`,
              `|--------|-------|`,
              `| ⏱️ Total Study Time | **${totalHours}h ${totalMins}m** |`,
              `| 📖 Study Sessions | **${studySessions.length}** |`,
              `| 📚 Assignments Created | **${hw.length}** |`,
              `| ✅ Assignments Completed | **${completed.length}** |`,
              `| 📆 Avg Daily Study | **${totalMinutes > 0 ? Math.round(totalMinutes / 7) : 0} min** |`,
              ``,
              subjectTable,
              ``,
              `### 📋 Session Log`,
              ...studySessions.map(i =>
                `- [#${i.number}](${i.html_url}) ${i.title}`
              ),
              ``,
              `---`,
              `> 🤖 Auto-generated by GitHub Actions`,
            ].join('\n');

            await github.rest.issues.create({
              ...context.repo,
              title: `📊 Weekly Summary — ${weekEnd}`,
              body,
              labels: ['weekly-summary', 'auto-logged'],
            });

            console.log(`Created weekly summary: ${studySessions.length} sessions, ${totalHours}h ${totalMins}m total`);
